name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ "main", "admin-dashboard-safe-20261115" ]
    paths:
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Set unique app version for this build
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          path = Path("app/build.gradle.kts")
          source = path.read_text()
          run = int(os.environ["GITHUB_RUN_NUMBER"])
          updated = re.sub(r'versionCode = [0-9]+; versionName = "[^"]+"', f'versionCode = {1000 + run}; versionName = "2.2.{run}"', source, count=1)
          if updated == source:
              raise SystemExit("Could not update Android version")
          path.write_text(updated)
          PY
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Prepare private signing key
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/janb-baytak-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/janb-baytak-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: gradle assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: janb-baytak-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        with:
          name: janb-baytak-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Prepare stable release APK
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: cp app/build/outputs/apk/release/app-release.apk janb-baytak.apk
      - name: Publish update release
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.2.${{ github.run_number }}
          name: جنب بيتك 2.2.${{ github.run_number }}
          generate_release_notes: true
          files: janb-baytak.apk

# Rebuild release after signing secrets were configured.
